services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Pass123"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Your_strong_Pass123\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Hospital.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SEED_DATA: "true"
      ConnectionStrings__Default: "Server=db;Database=HospitalDb;User Id=sa;Password=Your_strong_Pass123;TrustServerCertificate=True"
      Jwt__SigningKey: "change-me-in-production-please-256-bit-minimum-secret-key"
      Cors__AllowedOrigins__0: "http://localhost:8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5080:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mssql-data:
