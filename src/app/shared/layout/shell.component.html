<nav class="navbar navbar-dark app-brand-gradient sticky-top shadow-sm py-2">
  <div class="container-fluid">
    <button
      class="btn btn-outline-light border-0 d-lg-none me-2 px-2"
      type="button"
      aria-label="Toggle navigation"
      (click)="toggleSidebar()"
    >
      <i class="bi bi-list fs-4"></i>
    </button>

    <a class="navbar-brand fw-semibold d-flex align-items-center gap-2 me-auto" routerLink="/">
      <i class="bi bi-hospital"></i>
      <span>MediCare Clinic</span>
    </a>

    <div class="dropdown" ngbDropdown>
      <button class="btn btn-outline-light border-0 dropdown-toggle" ngbDropdownToggle type="button">
        <i class="bi bi-person-circle me-1"></i>
        <span class="d-none d-sm-inline">{{ user()?.fullName }}</span>
      </button>
      <div class="dropdown-menu dropdown-menu-end" ngbDropdownMenu>
        <span class="dropdown-item-text small text-secondary">
          Signed in as <strong>{{ user()?.role }}</strong>
        </span>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item" type="button" (click)="logout()">
          <i class="bi bi-box-arrow-right me-2"></i>Sign out
        </button>
      </div>
    </div>
  </div>
</nav>

<div class="app-shell">
  @if (sidebarOpen()) {
    <div class="app-shell__backdrop d-lg-none" (click)="closeSidebar()"></div>
  }

  <aside class="app-sidebar bg-white border-end" [class.app-sidebar--open]="sidebarOpen()">
    <div class="d-flex justify-content-between align-items-center d-lg-none px-3 py-2 border-bottom">
      <span class="fw-semibold">Menu</span>
      <button class="btn-close" aria-label="Close" (click)="closeSidebar()"></button>
    </div>

    <ul class="nav nav-pills flex-column gap-1 p-3">
      @for (item of navItems(); track item.path) {
        <li class="nav-item">
          <a
            class="nav-link d-flex align-items-center gap-2"
            [routerLink]="item.path"
            routerLinkActive="active"
            (click)="closeSidebar()"
          >
            <i class="bi" [class]="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </aside>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
